<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dwnPad Software</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>dwnPad</h1>
      <div class="status-bar">
        <button id="connectBtn" class="btn connect">Connect</button>
        <button id="disconnectBtn" class="btn disconnect" disabled>Disconnect</button>
        <span id="statusText" class="status-text">Disconnected</span>
        <span class="status-dot" id="statusDot"></span>
      </div>
    </header>

    <!-- 2×3 Button Grid -->
    <div class="button-grid" id="buttonGrid"></div>

    <!-- SOCD Controls -->
    <div class="socd-row">
      <button id="socdAddBtn" class="btn secondary">➕ Add SOCD Pair</button>
      <button id="socdClearBtn" class="btn danger">✖ Clear All</button>
      <div id="socdList" class="socd-list"></div>
      <span id="socdHint" class="socd-hint"></span>
    </div>

    <!-- Mode Selector & Controls -->
    <div class="mode-section">
      <div class="mode-selector">
        <span>Mode:</span>
        <label><input type="radio" name="mode" value="0" checked /> Key</label>
        <label><input type="radio" name="mode" value="1" /> Dual (Press + Release)</label>
        <label><input type="radio" name="mode" value="2" /> Macro</label>
      </div>

      <!-- Key Mode -->
      <div id="keyControls" class="key-controls">
        <span class="key-display-label">Press Key:</span>
        <span class="key-display" id="pressKeyDisplay">—</span>
      </div>

      <!-- Dual Mode -->
      <div id="dualControls" class="dual-controls" style="display:none;">
        <div class="dual-displays">
          <div>
            <span class="key-display-label">Press:</span>
            <span class="key-display dual-slot" id="dualPressDisplay" data-slot="press">—</span>
          </div>
          <div>
            <span class="key-display-label">Release:</span>
            <span class="key-display dual-slot" id="dualReleaseDisplay" data-slot="release">—</span>
          </div>
        </div>
        <div class="dual-buttons">
          <button id="copyPressToReleaseBtn" class="btn secondary">📋 Copy Press → Release</button>
          <button id="applyDualBtn" class="btn primary">Apply Dual Keys</button>
        </div>
      </div>

      <!-- Macro Mode (no profiles) -->
      <div id="macroControls" class="macro-controls" style="display:none;">
        <div class="macro-steps" id="macroSteps">
          <!-- Steps rendered by JS -->
        </div>
        <div class="macro-actions">
          <button id="addStepBtn" class="btn secondary">➕ Add Step</button>
          <button id="clearMacroBtn" class="btn danger">✖ Clear Macro</button>
          <button id="applyMacroBtn" class="btn primary">💾 Save to Arduino</button>
        </div>
      </div>
    </div>

    <!-- Keyboard -->
    <div class="keyboard-wrapper">
      <p class="keyboard-hint" id="keyboardHint">Click a button above to select it, then click a key to assign it.</p>
      <div class="keyboard" id="keyboard"></div>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button id="refreshBtn" class="btn secondary">Refresh</button>
      <button id="resetBtn" class="btn danger">Reset to Defaults</button>
    </div>

    <div class="log" id="log"><span class="log-empty">Waiting for actions…</span></div>
  </div>
  <script src="script.js"></script>
</body>

</html>
